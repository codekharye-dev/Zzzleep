<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4338ca" />
    <meta
      name="description"
      content="Zzzlep — Azərbaycanda özünüzə aid bir yer tapın. Seçilmiş evlər, villalar və unudulmaz səfərlər."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        if (JSON.parse(localStorage.getItem('zzzlep-dark') || 'false') === true)
          document.documentElement.dataset.theme = 'dark';
        const language = JSON.parse(localStorage.getItem('zzzlep-language') || '"az"');
        if (['az', 'en', 'ru'].includes(language)) document.documentElement.lang = language;
      } catch {}
    </script>
    <title>Zzzlep — Yaxşı yuxu, yaxşı səfər.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
