name: Deploy Zzzlep to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build -- --base="/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for legacy branch publishing to finish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$mode" = "workflow" ]; then
            echo "Pages uses Actions; no branch publishing to wait for."
            exit 0
          fi
          if [ "$mode" != "legacy" ]; then
            echo "::error::Unrecognized Pages publishing mode: $mode"
            exit 1
          fi
          # A legacy Pages build can otherwise overwrite this Vite artifact with raw TSX.
          # Wait only for the native run for this commit, then publish the built app last.
          for attempt in $(seq 1 40); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" --jq '.workflow_runs | map(select(.name == "pages build and deployment" and .event == "dynamic")) | first | .status // "pending"')
            echo "Source-branch publishing: $status"
            if [ "$status" = "completed" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::Source-branch publishing did not finish; refusing to race the website deployment."
          exit 1
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
